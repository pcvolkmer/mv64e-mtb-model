name: 'Run Tests'

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ '*' ]
  release:
    types: [ 'created' ]

jobs:

  tests:
    strategy:
      fail-fast: false
      matrix:
        language:
          - java
          - rust
          - go

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Java
      - uses: actions/setup-java@v5
        if: matrix.language == 'java'
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Setup Gradle
        if: matrix.language == 'java'
        uses: gradle/actions/setup-gradle@v3
      - name: Run tests
        if: matrix.language == 'java'
        working-directory: java
        run: ./gradlew test

      # Rust
      - name: Run tests
        if: matrix.language == 'rust'
        run: |
          cargo build --verbose
          cargo test --verbose

      # Go
      - name: Run tests
        if: matrix.language == 'go'
        working-directory: go
        run: go test -v

  publish:
    if: ${{ github.event_name == 'release' && github.event.action == 'created' }}
    strategy:
      fail-fast: false
      matrix:
        language:
          - java
          - go

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - tests
    steps:
      - uses: actions/checkout@v6

      # Java
      - uses: actions/setup-java@v5
        if: matrix.language == 'java'
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Setup Gradle
        if: matrix.language == 'java'
        uses: gradle/actions/setup-gradle@v3
      - name: Publish to Maven repo
        if: matrix.language == 'java'
        working-directory: java
        run: ./gradlew build publish -Pdnpm_dev_token=${{ secrets.DNPM_DEV_TOKEN }}

      # Go
      - name: Create Go module tag
        if: ${{ steps.release.outputs.release_created && matrix.language == 'go' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          GO_TAG="go/${RELEASE_TAG}"
          git tag "$GO_TAG" "$GITHUB_SHA"
          git push origin "$GO_TAG"